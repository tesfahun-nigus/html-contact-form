<!DOCTYPE html>
<html lang="en">
    <head >
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML Contact Form</title>
    </head>
    <body>
        <header>
            <h1>HTML Contact Form</h1>
        </header>
        <main>
            <form action="" method="get">
            <fieldset>
                <legend>Personal Information</legend>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname"> 
                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </fieldset>
            <fieldset>
                <legend>Subject</legend>
                <label>Subject:
                    <select name="subject">
                        <option value="software-engineering-opportunity">Software Engineering Opportunity</option>
                        <option value="internship-opportunity">Internship Opportunity</option>
                        <option value="freelance-project">Freelance Project</option>
                        <option value="collaboration">Collaboration</option>
                    </select>
                </label>
            </fieldset>
            <fieldset>
                <legend>Message</legend>
                <label>Message:
                    <textarea name="message"></textarea>
                </label>
            </fieldset>
            <fieldset>
                <legend>Contact Method</legend>
                <label>
                    <input type="radio" name="contact-method" value="email">Email
                </label>
                <br>
                <label>
                    <input type="radio" name="contact-method" value="github">GitHub
                </label>
                <br>
                <label>
                    <input type="radio" name="contact-method" value="phone">Phone
                </label>
            </fieldset>
            <fieldset>
                <legend>What Topic You Are Interested In Discussing?</legend>
                <label>
                    <input type="checkbox" name="interested-topic" value="web-development">Web Development
                </label>
                <br>
                <label>
                    <input type="checkbox" name="interested-topic" value="software-engineering">Software Engineering
                </label>
                <br>
                <label>
                    <input type="checkbox" name="interested-topic" value="full-stack-development">Full-Stack Development
                </label>
                <br>
                <label>
                    <input type="checkbox" name="interested-topic" value="project-collaboration">Project Collaboration
                </label>
            </fieldset>
            <button type="submit">Send</button>
            <br>
            <button type="reset">Reset</button>
            </form>
        </main>
    </body>
</html>
